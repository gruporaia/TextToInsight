- request:
    body: '{"contents": [{"parts": [{"text": "Voc\u00ea \u00e9 um revisor de qualidade
      para consultas SQL geradas por IA.\n\nSua tarefa: avaliar se a consulta SQL
      e seus resultados respondem adequadamente\n\u00e0 pergunta original do usu\u00e1rio.\n\n===
      PERGUNTA DO USU\u00c1RIO ===\nQuais sao as 5 categorias de produtos mais vendidas?\n\n===
      SQL GERADA ===\nSELECT\n  T2.product_category_name\nFROM order_items AS T1\nINNER
      JOIN products AS T2\n  ON T1.product_id = T2.product_id\nGROUP BY\n  T2.product_category_name\nORDER
      BY\n  COUNT(T1.product_id) DESC\nLIMIT 5\n\n=== RESULTADO DA EXECU\u00c7\u00c3O
      ===\nStatus: exec_ok\nTotal de linhas: 5\nAmostra dos resultados (primeiras
      linhas):\n[{''product_category_name'': ''cama_mesa_banho''}, {''product_category_name'':
      ''beleza_saude''}, {''product_category_name'': ''esporte_lazer''}, {''product_category_name'':
      ''moveis_decoracao''}, {''product_category_name'': ''informatica_acessorios''}]\n\n===
      ERROS (se houver) ===\nNenhum\n\nAvalie:\n1. A SQL responde \u00e0 pergunta
      do usu\u00e1rio?\n2. Os resultados fazem sentido?\n3. H\u00e1 algum erro l\u00f3gico
      ou de interpreta\u00e7\u00e3o?\n\nResponda no formato:\nVEREDITO: APROVADO ou
      REPROVADO\nFEEDBACK: <sua avalia\u00e7\u00e3o em 1-3 frases>"}], "role": "user"}],
      "safetySettings": [], "generationConfig": {"temperature": 0.7, "candidateCount":
      1}}'
