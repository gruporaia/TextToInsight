      -> customers.customer_id (on_update=NO ACTION, on_delete=NO ACTION)\n\n=== RELA\u00c7\u00d5ES
      NECESS\u00c1RIAS (caminhos de JOIN) ===\norders JOIN customers ON orders.customer_id
