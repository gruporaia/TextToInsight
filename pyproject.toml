[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-insight"
version = "0.1.0"
description = "Agentes LangGraph que transformam perguntas em linguagem natural em consultas SQL seguras, executadas no seu banco, com resposta em linguagem natural"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Caio Petroncini"},
    {name = "Julio Cesar Fuganti"},
    {name = "Luiz Correia dos Santos"},
    {name = "Antonio Carvalho"},
    {name = "Bernardo Rubio"},
    {name = "Jonas Honorato"},
]
keywords = ["text-to-sql", "nl2sql", "llm", "langgraph", "rag", "sql", "agentes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.1",
    "langchain>=1.2",
    "langchain-core>=1.2",
    "langchain-google-genai>=4.2",
    "langchain-openai>=1.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.2",  # uso na geração de gráficos e análise de dados; 2.2.2 é a primeira compatível com numpy 2
    "matplotlib>=3.9.0", # uso na geração de gráficos e visualizações; 3.9 é a primeira compatível com numpy 2
    "networkx>=3.0",
    "chromadb>=1.5.9",
    "tabulate>=0.10.0",
    "sqlalchemy>=2.0.0",
    "platformdirs>=3.0",
]

[project.scripts]
text-to-insight = "text_to_insight.cli:main"

[project.optional-dependencies]
# Drivers de banco: a biblioteca recebe uma Engine do SQLAlchemy pronta, então
# só precisa do driver de quem for usar PostgreSQL/MySQL (SQLite já vem no Python).
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-recording>=0.13.0",
    "aiohttp<3.10.0",
    "pytest-timeout>=2.3.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/gruporaia/TextToInsight"
Documentation = "https://github.com/gruporaia/TextToInsight#readme"
Repository = "https://github.com/gruporaia/TextToInsight.git"
"Bug Tracker" = "https://github.com/gruporaia/TextToInsight/issues"

# Só a biblioteca vai para o PyPI; scripts/, src/ (benchmarks) e tests/ ficam fora do wheel.
[tool.setuptools.packages.find]
include = ["text_to_insight*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "real_api: testes que executam chamadas reais ao provedor/modelo LLM",
]
