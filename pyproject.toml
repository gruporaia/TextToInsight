[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-insight"
version = "0.1.0"
description = "Sistema de agentes Supervisor/Hierárquico para transformar perguntas em código executável usando LangGraph"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Seu Nome", email = "seu.email@exemplo.com"}
]
keywords = ["langgraph", "agentes", "llm", "supervisor", "hierárquico"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",  # uso na geração de gráficos e análise de dados
    "matplotlib>=3.8.0", # uso na geração de gráficos e visualizações
    "networkx>=3.0",
    "chromadb>=1.5.9",
    "tabulate>=0.10.0",
]

[project.scripts]
text-to-insight = "text_to_insight.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-recording>=0.13.0",
    "pytest-timeout>=2.3.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/gruporaia/TextToInsight"
Documentation = "https://github.com/gruporaia/TextToInsight#readme"
Repository = "https://github.com/gruporaia/TextToInsight.git"
"Bug Tracker" = "https://github.com/gruporaia/TextToInsight/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["text_to_insight*"]
exclude = ["tests*", "build*", "meus_testes*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "real_api: testes que executam chamadas reais ao provedor/modelo LLM",
    "schemacrawler: Marca os testes que dependem do SchemaCrawler e do Java."
]
